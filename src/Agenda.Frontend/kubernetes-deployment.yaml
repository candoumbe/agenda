apiVersion: v1
kind: Namespace
metadata:
  name: agenda
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agenda-frontend-config
  namespace: agenda
data:
  AGENDA_AUTH_AUTHORITY: "https://keycloak.example.com/auth/realms/agenda"
  AGENDA_AUTH_CLIENT_ID: "agenda-frontend"
  AGENDA_AUTH_SCOPE: "openid profile email offline_access"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenda-frontend
  namespace: agenda
  labels:
    app: agenda-frontend
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agenda-frontend
  template:
    metadata:
      labels:
        app: agenda-frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        fsReadOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: frontend
        image: agenda-frontend:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8080
          name: http
          protocol: TCP

        envFrom:
        - configMapRef:
            name: agenda-frontend-config

        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 101
          capabilities:
            drop:
              - ALL
              - NET_RAW

        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: nginx-tmp
          mountPath: /tmp

      volumes:
      - name: nginx-cache
        emptyDir:
          sizeLimit: 100Mi
      - name: nginx-run
        emptyDir:
          sizeLimit: 10Mi
      - name: nginx-tmp
        emptyDir:
          sizeLimit: 50Mi

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - agenda-frontend
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: agenda-frontend
  namespace: agenda
  labels:
    app: agenda-frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: agenda-frontend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agenda-frontend
  namespace: agenda
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agenda-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agenda-frontend
  namespace: agenda
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: agenda-frontend

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agenda-frontend
  namespace: agenda
spec:
  podSelector:
    matchLabels:
      app: agenda-frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 443

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agenda-frontend
  namespace: agenda
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/gzip: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - agenda.example.com
    secretName: agenda-frontend-tls
  rules:
  - host: agenda.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agenda-frontend
            port:
              number: 80
