<header class="topbar">
  <div class="topbar__brand-and-menu">
    <a class="topbar__brand" routerLink="/" aria-label="Agenda, retour à l'accueil">
      <span class="topbar__brand-mark" aria-hidden="true">A</span>
      <span class="topbar__brand-text">Agenda</span>
    </a>

    <nav class="topbar__menu" aria-label="Menu de l'application">
      @for (item of menuItems; track item.path) {
        <a
          class="topbar__menu-link"
          [routerLink]="item.path"
          routerLinkActive="topbar__menu-link--active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </div>

  <label class="topbar__search" for="topbar-search">
    <span class="topbar__search-icon" aria-hidden="true">⌕</span>
    <input
      id="topbar-search"
      type="search"
      class="topbar__search-input"
      [placeholder]="searchPlaceholder()"
      [value]="searchTerm()"
      (input)="handleSearchInput($event)"
      aria-label="Rechercher dans l'application"
    />
  </label>

  <button type="button" class="topbar__auth-button" (click)="handleAuthAction()">
    <span class="topbar__auth-label">{{ authLabel() }}</span>
    <span class="topbar__auth-hint">{{ authHint() }}</span>
  </button>
</header>
