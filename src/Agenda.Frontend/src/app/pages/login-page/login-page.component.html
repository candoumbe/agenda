<section class="login-page" aria-labelledby="login-title">
  <div class="login-glow" aria-hidden="true"></div>
  <div class="login-card">
    <p class="login-kicker">Agenda</p>
    <h1 id="login-title">Connectez-vous</h1>
    <p class="login-subtitle">Utilisez votre compte Keycloak pour acceder a l'application.</p>

    <button type="button" class="login-button" (click)="startLogin()">
      Se connecter avec Keycloak
    </button>
  </div>
</section>
